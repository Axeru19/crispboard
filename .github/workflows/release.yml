name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath Crispboard-win-x64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Crispboard-win-x64.zip
          generate_release_notes: true
